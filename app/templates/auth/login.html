{% extends "base.html" %}

{% block title %}Tizimga kirish{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <!-- Logo and Title -->
        <div class="text-center">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-blue-700 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                <i class="fas fa-university text-3xl"></i>
            </div>
            <h2 class="mt-4 text-2xl font-extrabold text-slate-900 tracking-tight">
                HEMIS Axborot Tizimi
            </h2>
            <p class="mt-1 text-sm text-slate-500">
                Oliy ta'lim muassasasi talabalar boshqaruvi
            </p>
        </div>

        {% if error %}
        <div class="p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center gap-3">
            <i class="fas fa-exclamation-circle text-rose-500 text-lg flex-shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Form -->
        <form class="mt-8 space-y-5" action="/auth/login" method="POST">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                    Login / Talaba ID
                </label>
                <div class="relative">
                    <i class="fas fa-user absolute left-3.5 top-3.5 text-slate-400"></i>
                    <input id="username" name="username" type="text" required 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-sm"
                           placeholder="Masalan: admin yoki 39522110001">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                    Parol
                </label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3.5 top-3.5 text-slate-400"></i>
                    <input id="password" name="password" type="password" required 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-sm"
                           placeholder="Parolingizni kiriting">
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" checked
                           class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded">
                    <label for="remember-me" class="ml-2 block text-xs text-slate-600">
                        Meni eslab qolish
                    </label>
                </div>
                <a href="#" class="text-xs font-medium text-blue-600 hover:text-blue-500">Parolni unutdingizmi?</a>
            </div>

            <button type="submit" 
                    class="w-full py-3 px-4 text-sm font-semibold rounded-xl text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/25 transition flex items-center justify-center gap-2">
                <i class="fas fa-sign-in-alt"></i>
                <span>Tizimga kirish</span>
            </button>
        </form>

        <!-- Quick Demo Logins -->
        <div class="mt-6 pt-6 border-t border-slate-100">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider text-center mb-3">
                Tezkor demo loginlar
            </p>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button type="button" onclick="fillDemo('admin', 'admin123')" 
                        class="p-2 rounded-lg bg-slate-100 hover:bg-purple-50 hover:text-purple-700 border border-slate-200 text-slate-700 font-medium transition text-left">
                    <span class="block font-bold">👑 Administrator</span>
                    <span class="text-slate-400">admin / admin123</span>
                </button>

                <button type="button" onclick="fillDemo('dekan', 'dekan123')" 
                        class="p-2 rounded-lg bg-slate-100 hover:bg-amber-50 hover:text-amber-700 border border-slate-200 text-slate-700 font-medium transition text-left">
                    <span class="block font-bold">🏛️ Dekanat</span>
                    <span class="text-slate-400">dekan / dekan123</span>
                </button>

                <button type="button" onclick="fillDemo('teacher', 'teacher123')" 
                        class="p-2 rounded-lg bg-slate-100 hover:bg-blue-50 hover:text-blue-700 border border-slate-200 text-slate-700 font-medium transition text-left">
                    <span class="block font-bold">👨‍🏫 O'qituvchi</span>
                    <span class="text-slate-400">teacher / teacher123</span>
                </button>

                <button type="button" onclick="fillDemo('39522110001', 'student123')" 
                        class="p-2 rounded-lg bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-200 text-slate-700 font-medium transition text-left">
                    <span class="block font-bold">🎓 Talaba Kabineti</span>
                    <span class="text-slate-400">39522110001 / ...</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(user, pass) {
    document.getElementById('username').value = user;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
